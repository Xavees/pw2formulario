<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Talentos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<!-- Refazendo o CSS e HTML do Rubens -->
<style>
:root {
    --primary-color: #4a90e2;
    --primary-hover: #357abd;
    --bg-color: #f4f7f6;
}

body {
    background-color: var(--bg-color);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
}

.box {
    background: #fff;
    padding: 2rem;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 450px;
}

h2 {
    color: var(--primary-color);
    text-align: center;
    margin-bottom: 1rem;
}

.divisor {
    margin: 2rem 0;
    border-top: 1px solid #ddd;
}

button {
    background-color: var(--primary-color) !important;
    border: none !important;
}

button:hover {
    background-color: var(--primary-hover) !important;
}

#tabelaResultado {
    display: none;
    margin-top: 1rem;
}
</style>
</head>

<body>

<div class="box">



    <h2>Cadastro</h2>
    <form action="process.php" method="post" id="formCadastro">
        <div class="mb-2">
            <input type="text" name="nome" id="nomeDigitado" class="form-control" placeholder="Nome completo">
        </div>
        <div class="mb-2">
            <input type="email" name="email" id="emailDigitado" class="form-control" placeholder="E-mail">
        </div>
        <div class="mb-2">
            <input type="text" name="endereco" id="enderecoDigitado" class="form-control" placeholder="Endereço">
        </div>
        <button type="submit" class="btn w-100" onclick="return validarFormulario()">Cadastrar</button>
    </form>

    <div class="divisor"></div>

   



    <h2>Consulta</h2>
    <form id="consultaForm">
        <div class="mb-2">
            <input type="email" id="emailBusca" class="form-control" placeholder="Digite seu e-mail" required>
        </div>
        <button type="submit" id="btnConsultar" class="btn w-100">Consultar</button>
    </form>

    



    <div id="tabelaResultado">
        <table class="table table-bordered table-sm mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Endereço</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="col-id"></td>
                    <td id="col-nome"></td>
                    <td id="col-email"></td>
                    <td id="col-endereco"></td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- Parte do Bootstrap, só copiei e colei como o Rubens pediu -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.getElementById("nomeDigitado").focus();

function validarFormulario() {
    let nome = document.getElementById("nomeDigitado");
    let email = document.getElementById("emailDigitado");
    let endereco = document.getElementById("enderecoDigitado");

    if (nome.value.trim() === "") return alert("Preencha o nome"), false;
    if (email.value.trim() === "") return alert("Preencha o email"), false;
    if (endereco.value.trim() === "") return alert("Preencha o endereço"), false;

    return true;
}

// Função com retorno
function popularTabela(json) {
    if (!json.sucesso || !json.cadastro) {
        alert("Nenhum registro encontrado.");
        return;
    }

    document.getElementById('col-id').textContent = json.cadastro.id;
    document.getElementById('col-nome').textContent = json.cadastro.nome;
    document.getElementById('col-email').textContent = json.cadastro.email;
    document.getElementById('col-endereco').textContent = json.cadastro.endereco;

    document.getElementById('tabelaResultado').style.display = 'block';
}

// evitei mudar o codigo de js, pq eu quero colocar em ts.    

document.getElementById('consultaForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = document.getElementById('emailBusca').value;
    const btn = document.getElementById('btnConsultar');

    btn.disabled = true;
    btn.innerText = 'Consultando...';

    try {
        const formData = new FormData();
        formData.append('email', email);

        const response = await fetch('consulta.php', {
            method: 'POST',
            body: formData
        });

        const json = await response.json();
        popularTabela(json);

    } catch {
        alert('Erro na consulta');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Consultar';
    }
});
</script>

</body>
</html>
